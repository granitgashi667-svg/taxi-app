<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Test Core Modules</title>
    <style>
        body {
            background: #0a0416;
            color: #f5f0ff;
            font-family: monospace;
            padding: 20px;
        }
        .test {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 6px;
            border-left: 3px solid #a855f7;
            background: #1a0f30;
        }
        .pass { border-left-color: #22c55e; color: #22c55e; }
        .fail { border-left-color: #f43f5e; color: #f43f5e; }
        h1 { color: #a855f7; }
    </style>
</head>
<body>
    <h1>🚖 Test Core Modules</h1>
    <div id="results"></div>

    <script src="js/core/config.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/state.js"></script>

    <script>
        const results = document.getElementById('results');
        let passed = 0, failed = 0;

        function test(name, fn) {
            try {
                const r = fn();
                if (r === true || r === undefined) {
                    results.innerHTML += `<div class="test pass">✅ ${name}</div>`;
                    passed++;
                } else {
                    results.innerHTML += `<div class="test fail">❌ ${name} (ktheu: ${r})</div>`;
                    failed++;
                }
            } catch (e) {
                results.innerHTML += `<div class="test fail">❌ ${name} (gabim: ${e.message})</div>`;
                failed++;
            }
        }

        // ═══ TESTET ═══
        test('TaxiConfig ekziston', () => window.TaxiConfig !== undefined);
        test('TaxiEvents ekziston', () => window.TaxiEvents !== undefined);
        test('TaxiStorage ekziston', () => window.TaxiStorage !== undefined);
        test('TaxiUtils ekziston', () => window.TaxiUtils !== undefined);
        test('TaxiState ekziston', () => window.TaxiState !== undefined);

        test('Config APP.name = TaxiDispatch', () => TaxiConfig.APP.name === 'TaxiDispatch');
        test('Config TARIFFS.standard = 2.00', () => TaxiConfig.TARIFFS.standard.base === 2.00);
        test('Config ORDER_STATUS ka 7 statuse', () => Object.keys(TaxiConfig.ORDER_STATUS).length === 7);

        test('Utils.pad2(5) = "05"', () => TaxiUtils.pad2(5) === '05');
        test('Utils.initials("Granit Gashi") = "GG"', () => TaxiUtils.initials('Granit Gashi') === 'GG');
        test('Utils.money(5.5) = "€5.50"', () => TaxiUtils.money(5.5) === '€5.50');
        test('Utils.distanceKm(0,0,0,1) ≈ 111', () => {
            const d = TaxiUtils.distanceKm(0, 0, 0, 1);
            return d > 110 && d < 112;
        });
        test('Utils.uid() kthen string', () => typeof TaxiUtils.uid() === 'string');

        test('Storage.set/get punon', () => {
            TaxiStorage.set('test_key', { a: 1 });
            const v = TaxiStorage.get('test_key');
            return v && v.a === 1;
        });
        test('Storage.remove punon', () => {
            TaxiStorage.set('test_del', 'x');
            TaxiStorage.remove('test_del');
            return TaxiStorage.get('test_del') === null;
        });

        test('Events.on/emit punon', () => {
            let got = false;
            const unsub = TaxiEvents.on('test_event', () => { got = true; });
            TaxiEvents.emit('test_event');
            unsub();
            return got;
        });
        test('Events.off punon', () => {
            let count = 0;
            const h = () => count++;
            TaxiEvents.on('test_off', h);
            TaxiEvents.emit('test_off');
            TaxiEvents.off('test_off', h);
            TaxiEvents.emit('test_off');
            return count === 1;
        });

        test('State.get punon', () => TaxiState.get('soundEnabled') === true);
        test('State.set punon', () => {
            TaxiState.set('soundEnabled', false);
            const v = TaxiState.get('soundEnabled') === false;
            TaxiState.set('soundEnabled', true); // rikthej
            return v;
        });

        // ═══ REZULTATI ═══
        results.innerHTML += `
            <hr style="margin: 20px 0; border-color: #2d1a4a;">
            <h2 style="color: ${failed === 0 ? '#22c55e' : '#f43f5e'};">
                ${failed === 0 ? '🎉 TË GJITHA TESTET KALUAN!' : '⚠️ KA GABIME'}
            </h2>
            <p>✅ Passed: ${passed} | ❌ Failed: ${failed} | Total: ${passed + failed}</p>
        `;

        console.log(`%c🚖 Test Core: ${passed} passed, ${failed} failed`,
            `color: ${failed === 0 ? '#22c55e' : '#f43f5e'}; font-size: 16px; font-weight: bold;`);
    </script>
</body>
</html>
